name: МС build

# Release builds of the app on every push to the main branch: a signed
# Android APK and a Windows folder, both as downloadable artifacts.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Pub get
        working-directory: ms_app
        run: flutter pub get
      # Signed with android/app/ms-release.jks via android/key.properties.
      - name: Build APK
        working-directory: ms_app
        run: flutter build apk --release
      - name: Check the signature
        working-directory: ms_app
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -E "Signer #1 certificate (DN|SHA-256)"
      - uses: actions/upload-artifact@v4
        with:
          name: ms-android-${{ github.sha }}
          path: ms_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Pub get
        working-directory: ms_app
        run: flutter pub get
      - name: Build Windows
        working-directory: ms_app
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: ms-windows-${{ github.sha }}
          path: ms_app/build/windows/x64/runner/Release/
          if-no-files-found: error
