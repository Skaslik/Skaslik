name: МС build

# Release builds of the app on every push to the main branch: a signed
# Android APK, an unsigned iPhone IPA and a Windows folder, all as
# downloadable artifacts. Pull requests build too, so native code (Kotlin,
# Swift, C++) is compiled before it is merged, not after.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Pub get
        working-directory: ms_app
        run: flutter pub get
      # Signed with android/app/ms-release.jks via android/key.properties.
      - name: Build APK
        working-directory: ms_app
        run: flutter build apk --release
      # Fails if the APK isn't signed with the МС key (e.g. fell back to debug).
      - name: Check the signature
        working-directory: ms_app
        env:
          MS_KEY_SHA256: f5b4edd12225dfb0b3cda45f3e08eaee7d30df3e7ec2c2d62c93a9d084ce6078
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          out=$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          echo "$out" | grep -i "certificate" || true
          if ! echo "$out" | grep -qi "SHA-256 digest: $MS_KEY_SHA256"; then
            echo "::error::The APK is not signed with the МС release key"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ms-android-${{ github.sha }}
          path: ms_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # No Apple developer account: the IPA is unsigned. Install it with
  # Sideloadly or AltStore, which sign it with your own Apple ID.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Pub get
        working-directory: ms_app
        run: flutter pub get
      - name: Build iOS (unsigned)
        working-directory: ms_app
        run: flutter build ios --release --no-codesign
      - name: Package IPA
        working-directory: ms_app
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qry ms-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ms-ios-${{ github.sha }}
          path: ms_app/build/ipa/ms-ios-unsigned.ipa
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Pub get
        working-directory: ms_app
        run: flutter pub get
      - name: Build Windows
        working-directory: ms_app
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: ms-windows-${{ github.sha }}
          path: ms_app/build/windows/x64/runner/Release/
          if-no-files-found: error
