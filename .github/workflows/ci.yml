name: МС CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  # Ядро: чистый Dart — линт + тесты (крипто, CRDT, домены, sync engine).
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Pub get
        working-directory: core
        run: dart pub get
      - name: Analyze
        working-directory: core
        run: dart analyze
      - name: Test
        working-directory: core
        run: dart test

  # Приложение: линт + анализ (требует Flutter; Android-сборка — при наличии SDK).
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        working-directory: ms_app
        run: flutter pub get
      - name: Analyze
        working-directory: ms_app
        run: flutter analyze

  # Android AAB — только на тегах релиза.
  android:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [core, app]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pub get
        working-directory: ms_app
        run: flutter pub get
      - name: Build AAB
        working-directory: ms_app
        run: flutter build appbundle --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ms-android
          path: ms_app/build/app/outputs/bundle/release/app-release.aab
