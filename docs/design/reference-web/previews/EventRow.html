<!doctype html>
<html lang="ru">
<head><link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script>
<meta charset="utf-8">
<title>EventRow — preview</title>

<style>
  .pad { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; max-width: 440px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
</style>
</head>
<body>
<div class="pad"><div class="ms-list" id="l"></div></div>
<script>
  function ev(day, dow, who, title, meta, ic) {
    return "<div class=\"ms-rowcard\"><div class=\"ms-date\"><b>" + day + "</b><span>" + dow + "</span></div><i class=\"ms-bar ms-bar--" + who + "\"></i><div class=\"ms-rowcard__main\"><div class=\"ms-rowcard__title\">" + title + "</div><div class=\"ms-meta\">" + meta + "</div></div>" + (ic ? MS.icon(ic, { cls: "ms-tagicon" }) : "") + "</div>";
  }
  document.getElementById("l").innerHTML =
    ev("8", "сегодня", "sofia", "Ужин у мамы Софии", "19:30 · добавила София", "location_on") +
    ev("9", "пт", "michael", "Стоматолог", "10:00 · изменил Михаил 2 мин назад", "notifications") +
    ev("16", "пт–вс", "both", "Казань", "3 дня · поездка", "flight");
</script>
</body>
</html>
