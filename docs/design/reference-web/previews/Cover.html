<!doctype html>
<html lang="ru">
<head><link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script>
<meta charset="utf-8">
<title>МС</title>

<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--ground); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; width: 960px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .flame { fill: var(--flame); }
  .tint { fill: var(--flame-soft); }
  .deep { fill: var(--scene-fabric); }
  .mi { fill: var(--michael); }
  .so { fill: var(--sofia); }
  .dot { fill: var(--flame); }
  .blk { rx: var(--radius-lg); }
  .blk-md { rx: var(--radius-md); }
  .words { position: absolute; left: var(--space-8); bottom: var(--space-8); max-width: 440px; }
  .name { margin: 0; font-family: var(--font-serif); font-weight: 700; font-size: 120px; line-height: .9; letter-spacing: .02em; color: var(--ink); }
  .tag { margin: var(--space-3) 0 0 4px; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
  <div class="art" aria-hidden="true">
    <svg viewBox="0 0 480 288" width="480" height="288">
      <!--
        blocks      flame 128×236 bled off the top (the candle, the brand's one accent) · flame-soft 128×40 under it (tint) · scene-fabric 336×232 bleeding off the right (the armchair green, the deep field) · a michael half-disc and a sofia half-disc, r=72, on it — ≈40% of 960×288
        arrangement one tall flame slab with a wide deep slab beside it; the two halves sit on the deep slab a space-2 apart; bottoms on one line space-4 above the edge
        pattern     soft half-rounds, from "Общее показываем двумя половинками, а не третьим цветом": one disc split into Михаил's and Софья's halves; twelve flame dots at a space-6 pitch on the deep slab, like the calendar's author dots
        scales      gutters space-4; halves gap space-2; dot pitch space-6 (24), dot r 3; corners radius-lg (slabs), radius-md (tint); disc r = 72 (3 × space-6)
      -->
      <rect class="flame blk" x="16" y="-20" width="128" height="236" rx="20"/>
      <rect class="tint blk-md" x="16" y="232" width="128" height="40" rx="14"/>
      <rect class="deep blk" x="160" y="40" width="336" height="232" rx="20"/>
      <path class="mi" d="M296 84 A72 72 0 0 0 296 228 Z"/>
      <path class="so" d="M304 84 A72 72 0 0 1 304 228 Z"/>
      <g>
        <circle class="dot" cx="424" cy="64" r="3"/><circle class="dot" cx="448" cy="64" r="3"/><circle class="dot" cx="472" cy="64" r="3"/>
        <circle class="dot" cx="424" cy="88" r="3"/><circle class="dot" cx="448" cy="88" r="3"/><circle class="dot" cx="472" cy="88" r="3"/>
        <circle class="dot" cx="424" cy="112" r="3"/><circle class="dot" cx="448" cy="112" r="3"/><circle class="dot" cx="472" cy="112" r="3"/>
        <circle class="dot" cx="424" cy="136" r="3"/><circle class="dot" cx="448" cy="136" r="3"/><circle class="dot" cx="472" cy="136" r="3"/>
      </g>
    </svg>
  </div>
  <div class="words">
    <h1 class="name">МС</h1>
    <p class="tag">Общий дом для двоих: комната, свеча, календарь и файлы</p>
  </div>
</div>
</body>
</html>
