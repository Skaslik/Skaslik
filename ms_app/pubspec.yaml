name: ms_app
description: "«МС» — семейное приложение пары."
publish_to: none
version: 0.2.0+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ms_core:
    path: ../core
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.3
  path: ^1.9.0
  qr_flutter: ^4.1.0
  image: ^4.2.0
  rxdart: ^0.28.0
  logger: ^2.4.0
  url_launcher: ^6.3.0
  flutter_svg: ^2.3.0
  material_symbols_icons: ^4.2960.0
  http: ^1.6.0
  intl: ^0.20.3
  wakelock_plus: ^1.5.2
  screen_brightness: ^2.1.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/room/
    - assets/logo/
    - assets/fonts/OFL-Onest.txt
    - assets/fonts/OFL-IBMPlexMono.txt
    - assets/fonts/OFL-PTSerif.txt
  fonts:
    - family: Onest
      fonts:
        - { asset: assets/fonts/Onest-Regular.ttf, weight: 400 }
        - { asset: assets/fonts/Onest-Medium.ttf, weight: 500 }
        - { asset: assets/fonts/Onest-SemiBold.ttf, weight: 600 }
        - { asset: assets/fonts/Onest-Bold.ttf, weight: 700 }
    - family: IBMPlexMono
      fonts:
        - { asset: assets/fonts/IBMPlexMono-Regular.ttf, weight: 400 }
        - { asset: assets/fonts/IBMPlexMono-Medium.ttf, weight: 500 }
        - { asset: assets/fonts/IBMPlexMono-SemiBold.ttf, weight: 600 }
    - family: PTSerif
      fonts:
        - { asset: assets/fonts/PTSerif-Regular.ttf, weight: 400 }
        - { asset: assets/fonts/PTSerif-Bold.ttf, weight: 700 }
        - { asset: assets/fonts/PTSerif-Italic.ttf, style: italic }
